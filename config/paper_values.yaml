# Factor space and fixed settings, release candidate v0.6.
# Aligned one-to-one with protocol/preregistration.tex (Table 1, sections 4 to 8 and 10, appendix).
# Where this file and the protocol disagree, the protocol governs.
# Frozen at deposit. Tags: "agreed" = settled in the co-authors' review of 23 October 2026;
# "approved" = proposed in v0.3, v0.4 or v0.5 and approved (G. Vannucci's replies relayed
# 27 October and 2 November 2026; all co-authors at the meeting of 5 November 2026);
# "phase0c" / "phase0d" / "phase0e" / "phase0f" = adjudicated from results/phase0c_* (24 October),
# results/phase0d_denominator_guard.json (27 October), results/phase0e_model_groups.json
# (2 and 10 November) and results/phase0f_deposit_crosswalk.json (10 November 2026);
# "proposed v0.6" = blue text in the release-candidate PDF, from the audit made before archiving
# (10 November 2026), awaiting approval.
#
# cost: expensive = requires retraining (outer design, 512 scrambled Sobol' points)
#       cheap     = varies per trained model (inner design, 8 points per training)
# declared: whether the paper or its SI states the paper's value (approved)

factors:

  G1_population:
    cost: expensive
    declared: "no"                # D2, D9
    type: categorical
    paper: "901"            # approved correction: the paper's figures, Table 1 and the deposit all rest on the 901-set (D9, D12)
    levels:                 # approved concretisation, counts from results/phase0_evaluation_subset.json and phase0_training_set.json
      "901":  {rule: "complete 2020-2100 raw coverage on 5 features + 10 electricity variables, Kyoto exempt (D9)", counts: {C1234: 554, C56: 237, C78: 110},
               note: "contains no IMAGE or WITCH scenario: none of their 257 vetted scenarios reports World geothermal electricity (D15, phase0e)"}
      "910":  {rule: "as 901, carbon sequestration imputed rather than required", counts: {C1234: 554, C56: 237, C78: 119}}
      "828":  {rule: "as 901, native Kyoto Gases (Emissions|Kyoto Gases) reporting also required; the level restricts the population and changes no variable", counts: {C1234: 508, C56: 219, C78: 101}}   # wording proposed v0.6 (D16)
      "1160": {rule: "D2 rule, 5 features only; missing electricity values filled by G4", counts: {C1234: 680, C56: 308, C78: 172}}
      "1202": {rule: "all vetted with climate category; missing values filled by G4", counts: {C1234: 700, C56: 309, C78: 193}}
    note: >-                # approved; corrected in v0.6 (proposed v0.6, D16): 901-set, not 828-set
      G1 and G4 interact by construction: under G4 imputation "none_drop_incomplete" every
      level shrinks to its complete cases on the generated set, the 901-set when that set is E
      (the 828-set at level 828), because the Kyoto Gases of the pipeline are never missing
    data_source: >-         # proposed v0.6 (phase0f)
      training data are built from the AR6 World CSV with fixed.evaluation_set_E.ar6_variables
      (Kyoto Gases: the infilled AR6-GWP100 diagnostic at every level); at the paper's values of
      G1 and G3 they reproduce the deposited Real_*.csv (results/phase0f_deposit_crosswalk.json)

  G2_category_aggregation:
    cost: expensive
    declared: "yes"               # Methods
    type: categorical
    paper: "3way"
    levels:
      3way:   "C1234 / C56 / C78 (Methods)"
      4way:   "C12 / C34 / C56 / C78"
      8way:   "C1 ... C8"
      kmeans: "DTW + UMAP(n_neighbors=15, metric=precomputed, random_state=30) + k-means, k=3 (SI S2.2)"
    evaluation: >-              # approved (finer-category rules and one-to-one mapping: approved)
      claims and ensemble distances are computed on the three aggregates. Each finer category
      is trained with the G5 settings of the aggregate it belongs to, receives a share of the
      G7 sample size proportional to its real count in the 901-set, and its synthetic ensemble
      is pooled into that aggregate. The three k-means clusters are mapped one-to-one to the
      three aggregates by the assignment maximising the number of real scenarios they share.

  G3_variable_selection:
    cost: expensive
    declared: "yes"               # Methods (80% completeness), SI S2.3 (ranking)
    paper:
      pool_completeness: 0.80   # variables reported by >80% of scenarios per decade (Methods)
      n_key_features: 5
      ranking: "random forest importance, SI S2.3 settings: n_estimators=100, max_depth=8, min_samples_split=6, random_state=8, split 80/20 with random_state=3"
    range:
      pool_completeness: [0.60, 0.90]   # agreed; uniform (approved)
      n_key_features: [4, 9]            # agreed (G. Vannucci), integer, uniform on the integers (approved)
    generated_set: >-                   # approved, with the evaluation set E
      top-ranked key features united with the evaluation set E, so that every
      run's output lives in the same space; at paper values the union is E itself

  G4_preprocessing:
    cost: expensive
    declared: "yes"               # Methods: mean by year and category; TSFeatureWiseScaler((0,1))
    type: categorical
    paper: {imputation: mean_year_x_category, scaling: featurewise_01}
    levels:                     # equiprobable (approved)
      imputation: [mean_year_x_category, mean_year, median_year_x_category, none_drop_incomplete]
      scaling: [featurewise_01, standardize]

  G5_architecture:
    cost: expensive
    declared: "partly"            # ED Table 3 up to two slips (D4)
    paper:                             # phase0c: settings of the v1.0.0 "Secondary" notebooks (D4)
      vae:   {model: "tsgm zoo vae_conv5", latent_dim: 10, optimizer: Adam,
              C1234: {lr: 1.0e-3, decay_steps: 500, decay_rate: 0.98, epochs: 3000, batch: 50},
              C56:   {lr: 1.0e-3, decay_steps: 200, decay_rate: 0.98, epochs: 3000, batch: 30},
              C78:   {lr: 1.0e-3, decay_steps: 200, decay_rate: 0.98, epochs: 3000, batch: 25}}
              # C78: the notebook compiles with the schedule object of the C56 cell (cell 16 reuses lr_schedule);
              # ED Table 3 says batch 30 (slip)
      cgan:  {lr: 1.0e-4, decay_steps: 200, decay_rate: 0.95, epochs: 1500, batch: 100}
      rcgan: {lr: 1.0e-3, decay_steps: 1000, decay_rate: 0.95, epochs: 1800, batch: 100}   # ED Table 3 says decay_steps 200 (slip)
    range:
      vae_latent_dim: [4, 20]            # agreed, integer, uniform on the integers (approved)
      epochs_multiplier: [0.25, 2.0]     # agreed (G. Vannucci); applies to all three generators; log-uniform (approved)

  G6_seed:
    cost: expensive
    declared: "yes"               # SI S3 (seed 3; training not reproducible under a fixed seed)
    paper: 3
    range: "integer, uniform on [0, 2147483647]"   # approved
    role: >-                           # approved (v0.3 used the seed as the dummy reference)
      ordinary factor, judged against the dummy columns like any other (section 8). Each seed
      is used once, so an effect of the seed, if any, is an erratic function of its value that
      no binned or nearest-neighbour estimator can resolve; its index cannot show whether seeds
      control training. In Gower distances the seed counts as a mismatch indicator.

  G7_sample_size:
    cost: cheap
    declared: "yes"               # Fig. 3 caption (10,000 per category)
    paper: 10000                 # per category, for X1-X3 and X5; X4 uses 1,000 per category as in the code (phase0c)
    range: [1000, 30000]         # agreed; log-uniform (approved); each trained generator produces 30,000 per category once, subsampled per inner point

  G8_transfer_classifier:
    cost: cheap
    declared: "partly"            # random forest stated; grid search and random_state only in the code
    type: categorical
    paper: rf_code
    levels:                     # equiprobable (approved)
      rf_code: {model: "RandomForestClassifier(random_state=42)", tuning: "GridSearchCV, cv=3",
                grid: {n_estimators: [10, 100, 200, 500, 1000], max_depth: [6, 8, 10, 12, 14, 16], min_samples_split: [3, 4, 5, 6]}}   # phase0c, Experiment I grid of the Secondary notebooks
      rf_defaults: "scikit-learn 1.3.2 RandomForestClassifier defaults, no grid search, random_state from the inner point"
      logistic: "multinomial logistic regression, L2, C=1, max_iter=5000"
      xgboost: "XGBoost 2.1.1 XGBClassifier defaults, n_estimators=100"

  # G9_validation_metrics: withdrawn (approved). Its range was never specified, and
  # varying claim-rule thresholds would make the frozen rules moving targets.
  # Threshold influence is reported descriptively (section 7).

fixed:

  evaluation_set_E:            # approved (G. Vannucci)
    key_variables: [PrimaryEnergy_Coal, PrimaryEnergy_Oil, PrimaryEnergy_Gas, FinalEnergy_Liquid, CarbonSequestration, Kyoto_Gases]
    electricity: [SecondaryEle, SecondaryEle_Biomass, SecondaryEle_Coal, SecondaryEle_Gas, SecondaryEle_Geothermal,
                  SecondaryEle_Hydro, SecondaryEle_Nuclear, SecondaryEle_Oil, SecondaryEle_Solar, SecondaryEle_Wind]
    years: [2020, 2030, 2040, 2050, 2060, 2070, 2080, 2090, 2100]
    ar6_variables:               # phase0f: the AR6 v1.1 World variable behind each deposited variable (proposed v0.6)
      PrimaryEnergy_Coal: "Primary Energy|Coal"
      PrimaryEnergy_Oil: "Primary Energy|Oil"
      PrimaryEnergy_Gas: "Primary Energy|Gas"
      FinalEnergy_Liquid: "Final Energy|Liquids"
      CarbonSequestration: "Carbon Sequestration|CCS"
      Kyoto_Gases: "AR6 climate diagnostics|Infilled|Emissions|Kyoto Gases (AR6-GWP100)"   # not the native "Emissions|Kyoto Gases" (D16)
      SecondaryEle: "Secondary Energy|Electricity"
      SecondaryEle_Biomass: "Secondary Energy|Electricity|Biomass"
      SecondaryEle_Coal: "Secondary Energy|Electricity|Coal"
      SecondaryEle_Gas: "Secondary Energy|Electricity|Gas"
      SecondaryEle_Geothermal: "Secondary Energy|Electricity|Geothermal"
      SecondaryEle_Hydro: "Secondary Energy|Electricity|Hydro"
      SecondaryEle_Nuclear: "Secondary Energy|Electricity|Nuclear"
      SecondaryEle_Oil: "Secondary Energy|Electricity|Oil"
      SecondaryEle_Solar: "Secondary Energy|Electricity|Solar"
      SecondaryEle_Wind: "Secondary Energy|Electricity|Wind"

  real_comparator: "901-set (deposited Real_*.csv)"

  claims:
    X1a:
      tau1: 0.15
      quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
      normalisation: "real Q90-Q10 band of the variable in the same category and decade, never pooled across categories"   # approved; scope explicit in v0.4
      pooling: "median over 9 decades x 5 quantiles, per variable x category"   # approved
      pass: "all 18 variable x category medians at most tau1"   # approved (explicit)
      guard:                                  # approved, phase0d
        floor_fraction: 0.10
        reference: "median of the variable's bands over the nine decades in the same category"
        binding_at_floor: [CarbonSequestration C1234 2020, CarbonSequestration C56 2020, CarbonSequestration C56 2030,
                           CarbonSequestration C78 2020, CarbonSequestration C78 2030]
        descriptive_floor_fractions: [0.05, 0.20]
      descriptive: "maximum guarded deviation over the 45 elements of each variable x category; no decision"   # approved
    X1a_prime:                                # approved: "particularly C1234" as a separate indicator
      rule: "the median of C1234's 270 guarded elements (6 variables x 9 decades x 5 quantiles) is the smallest of the three categories"
    X1b: {years: [2050, 2100]}
    X2:
      tau2: 0.15                              # agreed (G. Vannucci)
      category: C1234
      years: [2030, 2050, 2100]
      n_elements: 45
      correlation: pearson                    # approved
      ordering: "signed Pearson correlation of PrimaryEnergy_Coal and Kyoto_Gases in 2030 exceeds that in 2100 (real 901-set: 0.82 and 0.21)"   # approved
    X3:  {sumcheck_threshold: 0.012, min_fraction: 0.0086, aggregation_over_years: mean}   # fraction approved; aggregation phase0c (D13: no code, no aggregation reproduces 1.2%)
    X4:  {experiment: "I, synthetic to real", test_population: "901-set", like_for_like: true,
          synthetic_per_category: 1000, inputs: "trapezoid-cumulated 2020-2100 values of the 15 variables of E other than Kyoto Gases",
          G7_acts: false}   # phase0c (D12); G7 does not act on X4 (approved)
    X5:                                       # labels, reference mixes, folds: approved
      labels:
        source: "SI S2.3 and Table S3: versions merged into frameworks following Dekker et al. 2023, Nature 624, 309-316; first nine kept"
        paper_nine: [IMAGE, TIAM-ECN, GCAM, POLES, AIM, MESSAGE, REMIND, WITCH, COFFEE]
        used: [AIM, COFFEE, GCAM, GEM-E3, MESSAGE, POLES, REMIND, TIAM-ECN]   # phase0e: the seven of the nine present in the 901-set plus GEM-E3 (D15)
        versions:                             # AR6 v1.1 model names; counts in results/phase0e_model_groups.json
          AIM: [AIM/CGE 2.0, AIM/CGE 2.1, AIM/CGE 2.2, AIM/Hub-Global 2.0]
          COFFEE: [COFFEE 1.1]
          GCAM: [GCAM 4.2, GCAM 5.2, GCAM 5.3, GCAM-PR 5.3]
          GEM-E3: [GEM-E3_V2021]              # Table S3 row 12, outside the nine
          IMAGE: [IMAGE 3.0, IMAGE 3.0.1, IMAGE 3.0.2, IMAGE 3.2]
          MESSAGE: [MESSAGE-GLOBIOM 1.0, MESSAGEix-GLOBIOM 1.0, MESSAGEix-GLOBIOM_1.1, MESSAGEix-GLOBIOM_1.2, MESSAGEix-GLOBIOM_GEI 1.0]
          POLES: [POLES ADVANCE, POLES CD-LINKS, POLES EMF30, POLES EMF33, POLES ENGAGE, POLES GECO2019]
          REMIND: [REMIND 1.6, REMIND 1.7, REMIND 2.1, REMIND-Buildings 2.0, REMIND-MAgPIE 1.5, REMIND-MAgPIE 1.7-3.0,
                   REMIND-MAgPIE 2.0-4.1, REMIND-MAgPIE 2.1-4.2, REMIND-MAgPIE 2.1-4.3, REMIND-Transport 2.1]
          TIAM-ECN: [TIAM-ECN 1.1]
          WITCH: [WITCH 4.6, WITCH 5.0, WITCH-GLOBIOM 3.1, WITCH-GLOBIOM 4.2, WITCH-GLOBIOM 4.4]
        not_grouped: [C-ROADS-5.005, EPPA 6, MERGE-ETL 6.0]   # Table S3 rows 10, 11 and 13; none in the 901-set
      merge_note: "the merge is the paper's own (SI S2.3), which cites Dekker et al. 2023, Nature; the X5 test idea relates to Dekker et al. 2023, Nature Energy 8, 1395-1404 (model fingerprints)"
      classifier: "random forest of G8's paper level (rf_code), fitted in each of the five training folds with its grid search inside the fold; no classifier is refitted on the whole 901-set"   # approved; fold detail approved
      inputs: "trapezoid-cumulated 2020-2100 values of the 16 variables of E"   # approved
      folds: "data/derived/x5_folds_901.csv (phase0e): duplicates (AR6 values on the fifteen variables of the D9 rule coinciding in every decade, to within 1e-6 of each variable's largest absolute value; 32 groups, 66 scenarios) form one unit; the 867 units are ordered by category, group and SHA-256 of 'model|scenario' (the smallest among a unit's members) and dealt to folds 1-5 in turn; rows in the order of the SHA-256 key for fitting"   # approved; units of duplicates proposed v0.6 (D17)
      inner_folds: "the three inner folds of the grid search are dealt in the same way from the units of the four training folds: units ordered by category, group and key, dealt to inner folds 1-3 in turn"   # proposed v0.6 (replaces the inner split fixed by the row order)
      crosswalk: "data/derived/crosswalk_901.csv (phase0f): attaches Model, Scenario and key, hence model group and fold, to the anonymous rows Scenario:k of the deposited Real_*.csv"   # proposed v0.6
      fitting: "fold classifiers, out-of-fold predictions, gates and references computed once with the deposited code, after the code deposit and before the first run, and archived"   # approved
      gate: "lower bound of the 95% Clopper-Pearson interval of the out-of-fold accuracy (correct out-of-fold predictions out of 901) exceeds the majority-class rate (REMIND, 296/901 = 0.329)"   # approved; interval type and counting approved
      gate_by_category: "the same test within each category against its own majority rate: C1234 REMIND 185/554 = 0.334, C56 MESSAGE 77/237 = 0.325, C78 REMIND 58/110 = 0.527"   # approved
      gate_failure: "X5 not testable, no indices, if the pooled gate fails or no category passes its gate; a category failing its gate is reported as not testable"   # approved; per-category part approved
      labels_predicted: "hard labels, as returned by predict"   # approved
      real_reference: "per category, the mix of the out-of-fold predicted labels of its real scenarios"   # approved (proposed by G. Vannucci)
      uniform_reference: "per category, the mix predicted for a uniform mix of the eight groups: the mean of the rows (true groups) of that category's out-of-fold confusion matrix, each row normalised to sum to one"   # approved
      uniform_reference_variant: "the same from the confusion matrix of the whole 901-set; reported, no decision"   # approved
      synthetic_mix: "per category, the mix of labels the five fold classifiers assign to its synthetic scenarios, averaged over the five"   # approved
      rule: "X5 holds if, in each category that passes its gate, TV(synthetic mix, real reference) < TV(synthetic mix, uniform reference)"   # approved
      G1_note: "under every factor level the references are those of the 901-set, the real comparator of every claim"   # approved
      limitations: "each fold classifier has seen four fifths of the real scenarios the generator learns from, so it may label synthetic scenarios with less shrinkage than held-out real ones; duplicates aside, scenarios of the same model and study can fall in different folds, so out-of-fold accuracy and the gates are optimistic (40 pairs of distinct scenarios differ by less than 1% of each variable's largest value on the fifteen variables, 18 of them by less than 0.1%; the folds separate 35 and 16 of these pairs)"   # approved; duplicates clause and counts proposed v0.6
      G7_acts: true                     # sets the size of the synthetic ensemble classified
      G8_acts: false

  design:
    R0_replicates: 20                 # agreed
    delta0_percentile: 95             # agreed
    delta0_distance: "marginal distance of section 7, with its floors"   # approved
    N_outer: 512                      # agreed, scrambled Sobol' (scrambling approved)
    N_inner: 8                        # agreed; scrambled Sobol' over G7, G8 per training (approved)
    units: {training: "one outer point", evaluation: "one inner point of one training, 4096 in all", run: "any training or any evaluation of a claim rule on generated data (deposit trigger)"}   # approved
    distributions:                    # approved
      continuous: "uniform on the range, except G5 epochs_multiplier and G7 sample size, which are log-uniform"
      integer: "uniform on the integers"
      categorical: "equiprobable levels"
    dummies:                          # approved; drawn with the factors, never passed to the pipeline
      outer: [D1, D2, D3]             # three further coordinates of the outer design
      inner: [D4]                     # one further coordinate of the inner design
      cells: "cut with the same cell proportions as each factor served (2, 4, 5, 6 equal cells, M equal bins, the latent dimension's cells)"
      reference: "mean index of the dummies of the factor's design level (D1-D3 for G1-G6, D4 for G7-G8), cut like the factor"
    stopping_rule: >-                 # agreed values (0.05 at N_outer/2); deterministic form approved
      at 256 trainings, if the 95% bootstrap intervals of the primary index of every expensive
      coordinate and of the matched dummies all have half-width below 0.05, stop; otherwise run to 512
    stopping_halfwidth: 0.05          # agreed, checked at N_outer/2 = 256
    robust_threshold: 0.80            # agreed; fraction of evaluations, point estimate (unit approved)
    fragile_threshold: 0.50

  estimator:
    marginal_distance: "mean of squared 1-D W2 over the 144 standardised variable-year marginals, square-rooted (approved instantiation of the agreed mean)"
    standardisation: "SD of each variable-year marginal in the corresponding category of the real 901-set"   # agreed
    standardisation_guard:            # approved, phase0d
      floor_fraction: 0.10
      reference: "median of the variable's SDs over the nine decades in the same category"
      binding_at_floor: "13 of 432 variable-category-year marginals, all 2020 (listed in results/phase0d_denominator_guard.json)"
      descriptive_floor_fractions: [0.05, 0.20]
    quantile_definition: "linear interpolation between order statistics (numpy default, Hyndman-Fan type 7)"   # approved
    sd_definition: "sample standard deviation, ddof = 1"   # approved
    quantile_levels: {n: 99, levels: "(k - 0.5)/99, k = 1..99"}   # approved (levels explicit in v0.4)
    sliced_wasserstein: {L: 200, directions: "drawn once, archived, shared across all trainings and replicates"}   # agreed
    sinkhorn: {epsilon: "0.05 x median pairwise squared Euclidean cost in standardised space", subsample: 2000, epsilon_source: "deposited synthetic ensembles A3, computed once (approved)", debiased: true,
               index_note: "no projection possible; keeps the large null value of the unprojected index; read against matched dummies only (approved)"}
    index:                             # approved (v0.3 used the unprojected multivariate W2, whose null value approaches 1 - 1/m)
      form: "given-data OT index, quadratic cost, on one-dimensional projections of the embedding"
      directions: {L_prime: 200, note: "unit directions of the embedding space, drawn once and archived"}
      w2: "exact one-dimensional W2 between the empirical distributions of all trainings and of the trainings in one cell"
      primary: "marginal-quantile embedding, three categories jointly (concatenated vectors), per expensive coordinate"
      robustness: ["per category", "sliced embedding", "Sinkhorn divergence as ground cost"]
    first_order_ensemble_aggregated: "tr Cov(E[Y|X_j]) / tr Cov(Y), same cells; for the secondary criteria of section 8 (approved)"
    total_order_ensemble: "variance-based total-order index aggregated over the coordinates of Y (Gamboa et al. 2014), nearest-neighbour estimator as in claim_indices; secondary criteria only (approved)"
    bins_M: 8                          # agreed; sensitivity M in {5, 8, 12}
    partitions:                        # approved; cells per factor coordinate; no cell is merged
      G1_population: 5
      G2_category_aggregation: 4
      G3_pool_completeness: M
      G3_n_key_features: 6
      G4_imputation: 4
      G4_scaling: 2
      G5_vae_latent_dim: "M cells of consecutive values, sizes as equal as possible, larger cells last (M = 8: 4-5, 6-7, ..., 16-17, 18-20)"
      G5_epochs_multiplier: M
      G6_seed: M
      G7_sample_size: M
      G8_transfer_classifier: 4
    claim_indices:                     # approved
      first_order: "given-data S_j of the binary pass indicator, same cells, all eleven coordinates; enters the primary decision (section 8)"
      total_order:
        estimator: "nearest-neighbour residual variance (Devroye et al. 2018; Broto et al. 2020)"
        distance: "Gower on the coordinates of X_~j: equal weights, numeric coordinates scaled by their range, categorical coordinates and the seed as mismatch indicators; dummy columns never enter"
        neighbours_expensive: "never from the same training, nor from a bootstrap copy of it"
        neighbours_cheap: "within the same training for G7, G8 and D4 (totals conditional on the trained generator)"
        reference_totals: "T_D: the same estimator conditioned on all factor coordinates (training noise plus estimator bias), common to D1-D3; T_D4: within-training analogue, the reference for G7 and G8"
        status: "exploratory; secondary criteria only"
      residual: "1 - sum_j S_j: interactions plus training noise, read by the secondary criteria of section 8"
      undefined: "a claim that holds in all or none of the evaluations has no indices"   # approved
    bootstrap: {R: 1000, unit: "training (outer point), inner points carried along (approved)", interval: "95% percentile"}
    threshold_curves: {tau1: [0.05, 0.30], tau2: [0.05, 0.30], sumcheck: [0.0001, 0.020], sumcheck_scale: log}   # approved, descriptive only

  decision:                            # approved; the dummy columns replace the seed as reference in v0.4
    primary: >-
      a coordinate is influential if the lower 95% bound of its index (primary projected OT
      index for the ensemble, nine expensive coordinates; S_j for each claim, eleven
      coordinates) exceeds the upper 95% bound of the mean index of its matched dummies; a
      factor with two coordinates (G3, G4, G5) is influential if either is
    secondary_interactions: "interactions are material if the lower 95% bound of 1 - sum_j (S_j - D_j) - T_D exceeds 0, with D_j the mean first-order index of j's matched dummies; aggregated variance-based indices for the ensemble outputs"
    secondary_factor: "a coordinate not influential by the primary rule acts through interactions if the lower 95% bound of its T_j exceeds the upper 95% bound of its reference total (T_D, or T_D4 for G7 and G8)"
    conservativeness: "expected, checked by the mock tests of the code deposit"
    headline: "declared versus undeclared factors as classified in Table 1 (field declared above); dominant = influential by the primary rule"

  comparison_across_cases:             # approved; case_2023 approved
    metrics: ["ranking of the shared factors", "index minus the mean index of its matched dummies"]
    not_used: "ratios to a dummy (near zero under pick-freeze estimators, shrinking like 1/N under binned estimators)"   # wording proposed v0.6
    case_2023:                          # approved (proposed by G. Vannucci)
      archive: "data/external/gsa2023/: results file, generating script, README with the design, the column dictionary, the rows forming the base matrices A and B, and the mapping of the 12 factors to the coordinates of G1-G8; results file pinned by SHA-256 in DATA.md (C1) and in the protocol"
      sha256: "e13147fcc7d4683046337fabdb0cfe99153c3eece85f7a59fc419f0cb47dac56"   # final_results.rds, commit 3d26d6d, verified 2026-11-05 with the folder's sha256.txt
      readme_sha256: "f68031806bf40a31929ae3772466db417656d39595ddf919a5c2c25806de346f"   # README.md as of commit 2b57183 (final mapping, 9 November 2026)
      runs: "the rows the README identifies as the base matrices A and B, pooled (8,192 of 57,344 runs; N = 4,096 each); the AB rows are not used"
      outputs: "the 13 claim indicators"
      matching: "at the level of coordinates (eleven in this case: G3, G4 and G5 have two); only factors the README maps to a coordinate are compared; where several map to one coordinate, all are reported and the largest of their dummy-corrected indices represents them"
      estimator: "binned first-order index of section 7: M = 8 equal-count bins for continuous factors (M = 5 and 12 also reported), levels for discrete ones"
      dummies: "numpy.random.default_rng(2023).random((8192, 3)), rows in the order of A then B as the README lists them, each column cut like the factor it serves; pseudo-random, since the design has already been run"
      inference: "bootstrap resampling runs, R = 1000, 95% percentile intervals"
      reported: "in both cases, the shared coordinates ranked by their dummy-corrected first-order indices, per claim and averaged over the claims that have indices in that case; the original first-order indices (Saltelli's estimator, as the README of C1 documents; N = 4,096) alongside"   # estimator name proposed v0.6
      timing: "computed with the deposited analysis code (deposit step 2)"
      decision: "descriptive, no decision"

