# Factor table (DRAFT — ranges to be frozen in the pre-registration protocol).
# paper: value used by Li et al. (2025), with provenance.
# range: candidate perturbation range/levels; TBD entries must be justified
#        (one line each) in the protocol before freeze.
# cost: expensive = requires retraining; cheap = varies per trained model.

G1_scenario_subset:
  cost: expensive
  paper:
    vetting: "AR6 vetted with climate categorization (n=1202, ED Table 1)"
    extra_filter: "UNDECLARED — 42 scenarios further dropped (n=1160, SI S3.1); see DISCREPANCIES.md D2"
  range:
    vetting_levels: ["vetted_1202", "reconstructed_1160", "vetted+completeness_variants"]  # TBD after D2 adjudication

G2_category_aggregation:
  cost: expensive
  paper: {labels: ["C1234", "C56", "C78"], derivation: "DTW + UMAP(n_neighbors=15, random_state=30, metric=precomputed) + k-means; then direct aggregation used"}
  range:
    aggregation_levels: ["C1234/C56/C78", "C12/C34/C56/C78", "C1-C8 (8-way)", "kmeans-cluster labels as-is"]  # TBD

G3_variable_selection:
  cost: expensive
  paper:
    pool: "100 vars reported by >80% of scenarios per 10-yr interval (of 1,393)"
    initial_shortlist: "13 key variables 'drawing on real-world experience' (SI S2.3) — itself an analyst choice"
    rf: {n_estimators: 100, max_depth: 8, random_state: 8, min_samples_split: 6, split: "80/20, random_state=3"}
    xgb_shap: {objective: "reg:squarederror", max_depth: 6, reg_alpha: 0.2, random_state: 5, n_estimators: 100}
    final_features: ["PrimaryEnergy_Coal", "PrimaryEnergy_Oil", "PrimaryEnergy_Gas", "FinalEnergy_Liquid", "CarbonSequestration"]  # + KyotoGases as label? (D3)
  range:
    completeness_threshold: [0.6, 0.9]          # TBD
    n_features: [4, 8]                          # TBD
    importance_metric: ["rf_gini", "shap"]      # TBD
    rf_max_depth: [4, 14]                       # TBD

G4_preprocessing:
  cost: expensive
  paper:
    imputation: "sample mean per year x climate category (note D8: conditions on the label)"
    scaling: "tsgm TSFeatureWiseScaler((0,1))"
    time_grid: "2010-2100, 10-yr step (but see D5)"
  range:
    imputation: ["mean_year_x_category", "mean_year_only", "median_year_x_category", "drop_incomplete"]  # TBD
    scaling: ["featurewise_01", "standardize"]  # TBD

G5_architecture:
  cost: expensive
  paper:
    vae: {optimizer: Adam, lr_schedule: "ExponentialDecay(1e-3, steps=500|200, rate=0.98)", epochs: 3000, batch: [50, 30, 30]}  # per ED Table 3 (C1234/C56/C78)
    cgan: {epochs: "500 (SI) vs 1500 (ED Table 3) — D4", lr: 1e-4}
    rcgan: {epochs: "1200 (SI) vs 1800 (ED Table 3) — D4", lr: 1e-3}
  range:
    vae_latent_dim: "TBD after reading Extended Data Table 3 details / code"
    epochs_multiplier: [0.5, 2.0]               # TBD
    lr_multiplier: [0.3, 3.0]                   # TBD

G6_seed:
  cost: expensive  # per authors, seed does NOT make training reproducible (D1)
  paper: {latent_noise_seed: 3, tf_global_seed: "set but non-deterministic (D1)"}
  role: "noise floor: R seed-only replicates at paper values; R TBD (>= 20)"

G7_synthetic_sample_size:
  cost: cheap
  paper: {per_category: 10000, total: 30000}
  range: [1000, 30000]                          # TBD

G8_label_transfer_classifier:
  cost: cheap
  paper: {classifier: "RandomForest (settings per code — record)", direction: ["syn->real (Exp I)", "real->syn (Exp II)"]}
  range:
    classifier: ["rf_paper", "rf_alt_hyper", "logreg", "xgboost"]  # TBD
    split_seed: "vary"

G9_validation_metrics:
  cost: cheap
  paper:
    distribution: "boxplot quantiles by category/year (Fig. 3)"
    correlation: "R2 coal-vs-Kyoto + heatmaps (Fig. 4)"
    consistency: "electricity sum-check, threshold 1.2% AR6 average (Fig. 5)"
  range:
    ot_distance: ["sliced_wasserstein", "sinkhorn", "exact_1d_marginals"]  # our instrument; spec frozen in protocol
    sumcheck_threshold: [0.008, 0.02]           # TBD
